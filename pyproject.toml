[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "seedlabeler"
version = "0.1.0"
description = "Desktop app: stereo seed traits, review/correct outlines, label data and train per-crop segmentation models"
requires-python = ">=3.10"
dependencies = [
    # chickpea package is vendored in src/chickpea (formerly the separate chickpea-seed repo)
    "sonyrx0",          # pip install -e ../SonyRX0
    "colourcal",        # pip install -e ../ColourCal
    "PySide6>=6.6",
    "numpy",
    "scipy",
    "pandas",
    "scikit-image>=0.20",
    "opencv-contrib-python>=4.8,<5",
]

[project.optional-dependencies]
train = ["ultralytics", "torch", "torchvision"]
oak = ["depthai>=3.11,<4", "matplotlib"]  # OAK-D camera system; matplotlib writes the stage sheet
dev = ["pytest"]

[project.gui-scripts]
seedlabeler = "seedlabeler.app:main"

[tool.setuptools.packages.find]
where = ["src"]
